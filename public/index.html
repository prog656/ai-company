<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<title>AI 工作室</title>
<style>
  :root{
    --bg:#0A0C10;
    --surface:#11141B;
    --card:#161A23;
    --card2:#1C2130;
    --line:rgba(255,255,255,.07);
    --line2:rgba(255,255,255,.12);
    --text:#E9EDF4;
    --text2:#96A1B3;
    --text3:#5A6577;
    --accent:#2DD4A7;
    --accent-d:#14A37F;
    --warn:#F5A524;
    --danger:#F0616D;
    --sec:#2DD4A7;
    --wri:#8B7CFF;
    --rev:#F0616D;
    --res:#3B82F6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#05070A;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14.5px;-webkit-font-smoothing:antialiased;
  }
  .app{
    background:var(--bg);display:flex;flex-direction:column;
    height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;
  }
  @media (min-width:560px){
    body{display:flex;align-items:center;justify-content:center;padding:20px 0}
    .app{height:min(900px,94vh);border-radius:28px;border:1px solid var(--line);
      box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04)}
  }

  /* ---------- 顶栏 ---------- */
  header{
    flex:0 0 auto;padding:14px 18px 12px;display:flex;align-items:center;gap:11px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(45,212,167,.05),transparent);
  }
  .brand{
    width:36px;height:36px;border-radius:12px;flex:0 0 auto;position:relative;
    background:linear-gradient(140deg,#2DD4A7,#14A37F);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(45,212,167,.28);
  }
  .brand span{font-size:15px;font-weight:700;color:#04140F;letter-spacing:-.5px}
  .htxt{min-width:0}
  .htxt h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.2px}
  .htxt p{margin:2px 0 0;font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
  .pulse{width:5px;height:5px;border-radius:50%;background:var(--accent);position:relative}
  .pulse::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--accent);opacity:.25;animation:ring 2.2s ease-out infinite}
  .pulse.off{background:var(--text3)}
  .pulse.off::after{display:none}
  @keyframes ring{0%{transform:scale(.6);opacity:.4}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}

  .hbtn{
    margin-left:auto;height:32px;padding:0 13px;border-radius:10px;cursor:pointer;
    background:var(--card2);border:1px solid var(--line2);color:var(--text);
    font-size:12.5px;font-family:inherit;display:flex;align-items:center;gap:5px;
    transition:.15s;
  }
  .hbtn:hover{background:#232937;border-color:rgba(255,255,255,.2)}
  .hbtn svg{width:13px;height:13px}

  /* ---------- 主区 ---------- */
  main{flex:1 1 auto;overflow-y:auto;padding:16px 16px 8px;scrollbar-width:thin;scrollbar-color:#222 transparent}
  main::-webkit-scrollbar{width:5px}
  main::-webkit-scrollbar-thumb{background:#222834;border-radius:3px}
  .pane{display:none}
  .pane.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- 消息 ---------- */
  .row{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start;animation:pop .28s cubic-bezier(.2,.9,.3,1)}
  .row.me{flex-direction:row-reverse}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

  .av{
    width:32px;height:32px;border-radius:11px;flex:0 0 auto;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:#fff;
  }
  .av.r-secretary{background:linear-gradient(140deg,#2DD4A7,#0F7F63);box-shadow:0 3px 10px rgba(45,212,167,.22)}
  .av.r-writer{background:linear-gradient(140deg,#8B7CFF,#5B4BD6);box-shadow:0 3px 10px rgba(139,124,255,.22)}
  .av.r-reviewer{background:linear-gradient(140deg,#F0616D,#B93343);box-shadow:0 3px 10px rgba(240,97,109,.22)}
  .av.r-researcher{background:linear-gradient(140deg,#3B82F6,#1D5FC4);box-shadow:0 3px 10px rgba(59,130,246,.22)}
  .av.me-av{background:linear-gradient(140deg,#3B4657,#232A36);color:var(--text2);font-size:11px}

  .msg{max-width:264px}
  .who{font-size:11px;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .who b{font-weight:600;color:var(--text2);font-size:11.5px}
  .chip{font-size:9.5px;padding:1.5px 6px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--text2);letter-spacing:.2px}
  .chip.off{background:transparent;border:1px solid var(--line2);color:var(--text3)}
  .bub{
    background:var(--card);border:1px solid var(--line);
    border-radius:4px 16px 16px 16px;padding:11px 14px;
    font-size:14px;line-height:1.62;color:#D6DDE8;
    white-space:pre-wrap;word-break:break-word;
  }
  .me .bub{
    background:linear-gradient(140deg,#2DD4A7,#19B08C);color:#04140F;font-weight:500;
    border:none;border-radius:16px 4px 16px 16px;
    box-shadow:0 6px 20px rgba(45,212,167,.18);
  }
  .me .who{justify-content:flex-end}

  .sys{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:11.5px;color:var(--text3)}
  .sys::before{content:"";width:14px;height:1px;background:var(--line2);flex:0 0 auto}

  .status{
    margin:0 0 12px 41px;font-size:11.5px;color:var(--text3);
    display:flex;align-items:center;gap:7px;animation:fade .2s;
  }
  .sp{
    width:11px;height:11px;border-radius:50%;flex:0 0 auto;
    border:1.6px solid rgba(255,255,255,.12);border-top-color:var(--accent);
    animation:spin .75s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .tool{margin:0 0 10px 41px;font-size:11px;color:#4E5A6B;animation:fade .2s}

  .dm{
    margin:0 0 14px 41px;padding:1px 0 1px 12px;
    border-left:2px solid rgba(255,255,255,.1);
    font-size:12.5px;color:var(--text2);line-height:1.65;white-space:pre-wrap;
    animation:fade .25s;
  }
  .dm .h{font-size:10.5px;color:var(--text3);margin-bottom:4px;display:flex;gap:5px;align-items:center}
  .dm .h b{color:#7D8899;font-weight:500}

  /* 密报：唯一带颜色的东西，因为它最重要 */
  .sec{
    margin:0 0 14px 41px;padding:12px 14px;border-radius:14px;
    background:linear-gradient(140deg,rgba(245,165,36,.09),rgba(245,165,36,.03));
    border:1px solid rgba(245,165,36,.22);
    box-shadow:0 4px 24px rgba(245,165,36,.06);
    animation:pop .3s cubic-bezier(.2,.9,.3,1);
  }
  .sec .h{
    font-size:10.5px;color:var(--warn);margin-bottom:6px;
    display:flex;align-items:center;gap:6px;letter-spacing:.3px;font-weight:600;
  }
  .sec .h .lock{width:11px;height:11px}
  .sec .b{font-size:13.5px;line-height:1.62;color:#E6D4B5;white-space:pre-wrap}
  .sec .acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .mini{
    font-size:11.5px;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--text2);
    transition:.15s;
  }
  .mini:hover{background:rgba(245,165,36,.14);border-color:rgba(245,165,36,.4);color:var(--warn)}
  .sec .relayed{font-size:11px;color:var(--accent);display:flex;align-items:center;gap:5px}
  .sec .mute{font-size:11px;color:var(--text3)}

  /* ---------- 空状态 ---------- */
  .empty{text-align:center;padding:52px 24px;color:var(--text3)}
  .empty .ico{
    width:56px;height:56px;border-radius:18px;margin:0 auto 18px;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .empty .ico svg{width:24px;height:24px;stroke:var(--text3)}
  .empty b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:8px;letter-spacing:-.2px}
  .empty p{margin:0;font-size:13px;line-height:1.75;color:var(--text2)}

  /* ---------- 员工卡 ---------- */
  .staff{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;margin-bottom:10px;transition:.18s;animation:pop .3s;
  }
  .staff:hover{border-color:var(--line2);background:var(--card2)}
  .staff .top{display:flex;align-items:center;gap:11px}
  .staff .av{width:42px;height:42px;border-radius:14px;font-size:15px}
  .staff .nm{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
  .staff .pos{font-size:11.5px;color:var(--text2);margin-top:2px}
  .staff .del{
    margin-left:auto;width:28px;height:28px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--text3);
    background:transparent;border:none;transition:.15s;
  }
  .staff .del:hover{background:rgba(240,97,109,.12);color:var(--danger)}
  .staff .del svg{width:14px;height:14px}
  .staff .foot{
    display:flex;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  }
  .meta{
    font-size:10.5px;padding:3px 8px;border-radius:6px;
    background:rgba(255,255,255,.04);color:var(--text3);
    display:flex;align-items:center;gap:4px;
  }
  .meta.on{background:rgba(45,212,167,.1);color:var(--accent)}
  .meta svg{width:10px;height:10px}

  /* ---------- 文件 ---------- */
  .file{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:10px;animation:pop .3s;
  }
  .file .hd{display:flex;align-items:flex-start;gap:9px}
  .file .fi{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    background:rgba(139,124,255,.12);display:flex;align-items:center;justify-content:center;
  }
  .file .fi svg{width:16px;height:16px;stroke:var(--wri)}
  .file .ti{font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.1px}
  .file .sub{font-size:11px;color:var(--text3);margin-top:3px}
  .tag{
    font-size:10px;padding:2.5px 8px;border-radius:20px;margin-left:auto;flex:0 0 auto;
    font-weight:600;letter-spacing:.2px;
  }
  .tag.back{background:rgba(240,97,109,.13);color:var(--danger)}
  .tag.pass{background:rgba(45,212,167,.13);color:var(--accent)}
  .tag.pending{background:rgba(245,165,36,.13);color:var(--warn)}
  .file .why{
    margin-top:11px;padding:10px 12px;border-radius:10px;
    background:rgba(240,97,109,.06);border-left:2px solid rgba(240,97,109,.4);
    font-size:12px;line-height:1.6;color:#C9A9AD;
  }
  .file .pre{
    margin-top:10px;padding:11px 13px;border-radius:10px;background:#0D1017;
    font-size:12.5px;line-height:1.65;color:#9AA5B6;white-space:pre-wrap;
    max-height:130px;overflow:auto;border:1px solid var(--line);
  }
  .file .path{
    margin-top:10px;font-size:10.5px;color:var(--text3);font-family:ui-monospace,monospace;
    display:flex;align-items:center;gap:5px;
  }
  .file .path svg{width:11px;height:11px;stroke:var(--text3);flex:0 0 auto}

  /* ---------- 输入 ---------- */
  .composer{
    flex:0 0 auto;display:none;gap:9px;align-items:center;
    padding:10px 14px 12px;border-top:1px solid var(--line);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.2));
  }
  .composer.on{display:flex}
  .inputwrap{flex:1;position:relative}
  .composer input{
    width:100%;height:42px;border-radius:21px;border:1px solid var(--line2);
    background:var(--card);padding:0 16px;font-size:14px;color:var(--text);
    outline:none;font-family:inherit;transition:.2s;
  }
  .composer input::placeholder{color:var(--text3)}
  .composer input:focus{
    border-color:rgba(45,212,167,.45);background:var(--card2);
    box-shadow:0 0 0 3px rgba(45,212,167,.08);
  }
  .send{
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;
    background:linear-gradient(140deg,#2DD4A7,#14A37F);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(45,212,167,.3);transition:.18s;
  }
  .send:hover:not(:disabled){transform:scale(1.05)}
  .send:active:not(:disabled){transform:scale(.96)}
  .send:disabled{background:#232937;box-shadow:none;cursor:default;opacity:.5}
  .send svg{width:17px;height:17px}

  /* ---------- 底部导航 ---------- */
  .tabbar{
    flex:0 0 auto;display:flex;height:62px;background:rgba(17,20,27,.92);
    border-top:1px solid var(--line);backdrop-filter:blur(20px);
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:10.5px;color:var(--text3);cursor:pointer;border:none;background:none;
    font-family:inherit;position:relative;transition:.18s;
  }
  .tab svg{width:21px;height:21px;transition:.18s}
  .tab.on{color:var(--accent)}
  .tab.on svg{transform:translateY(-1px)}
  .tab.on::before{
    content:"";position:absolute;top:0;width:22px;height:2px;border-radius:0 0 2px 2px;
    background:var(--accent);box-shadow:0 0 10px rgba(45,212,167,.6);
  }

  /* ---------- 弹层 ---------- */
  .mask{
    position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:.22s;z-index:10;
  }
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:11;
    background:var(--surface);border-radius:24px 24px 0 0;
    border-top:1px solid var(--line2);
    padding:10px 18px 22px;transform:translateY(102%);
    transition:transform .28s cubic-bezier(.2,.9,.3,1);
    max-height:86%;overflow-y:auto;
    box-shadow:0 -20px 60px rgba(0,0,0,.6);
    scrollbar-width:thin;scrollbar-color:#2A3242 transparent;
  }
  .sheet::-webkit-scrollbar{width:4px}
  .sheet::-webkit-scrollbar-track{background:transparent}
  .sheet::-webkit-scrollbar-thumb{background:#2A3242;border-radius:2px}
  .hint{
    font-size:11.5px;line-height:1.65;color:var(--text3);
    padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.025);
    border:1px dashed rgba(255,255,255,.08);
  }
  .sheet.on{transform:translateY(0)}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
  .sheet h2{margin:0 0 5px;font-size:17px;font-weight:600;letter-spacing:-.3px}
  .sheet .sub{margin:0 0 18px;font-size:12px;color:var(--text2);line-height:1.6}
  .lbl{font-size:11px;color:var(--text3);letter-spacing:.5px;margin:16px 0 9px;font-weight:600}
  .opt{
    display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;
    background:var(--card);border:1px solid var(--line);margin-bottom:8px;
    cursor:pointer;transition:.16s;position:relative;
  }
  .opt:hover{border-color:var(--line2)}
  .opt.sel{border-color:rgba(45,212,167,.5);background:rgba(45,212,167,.06)}
  .opt.dis{opacity:.42;cursor:not-allowed}
  .opt .n{font-size:13.5px;font-weight:600}
  .opt .d{font-size:11px;color:var(--text3);margin-top:2px}
  .opt .chk{
    margin-left:auto;width:18px;height:18px;border-radius:50%;flex:0 0 auto;
    border:1.5px solid var(--line2);transition:.16s;
  }
  .opt.sel .chk{
    border-color:var(--accent);background:var(--accent);
    box-shadow:inset 0 0 0 4px var(--surface),0 0 12px rgba(45,212,167,.4);
  }
  .rowbtn{display:flex;gap:10px;margin-top:20px}
  .rowbtn button{
    flex:1;height:46px;border-radius:14px;font-size:14px;font-family:inherit;cursor:pointer;
    border:1px solid var(--line2);background:var(--card);color:var(--text2);
    transition:.16s;font-weight:500;
  }
  .rowbtn button:hover{background:var(--card2)}
  .rowbtn .pri{
    background:linear-gradient(140deg,#2DD4A7,#14A37F);color:#04140F;border:none;
    font-weight:600;box-shadow:0 6px 20px rgba(45,212,167,.25);
  }
  .rowbtn .pri:disabled{background:#232937;color:var(--text3);box-shadow:none;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span>司</span></div>
    <div class="htxt">
      <h1>AI 工作室</h1>
      <p><span class="pulse off" id="dot"></span><span id="sub">还没有员工</span></p>
    </div>
    <button class="hbtn" id="hireTop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      招人
    </button>
  </header>

  <main id="m-chat" class="pane on"><div id="stream"></div></main>
  <main id="m-staff" class="pane"><div id="roster"></div></main>
  <main id="m-file" class="pane"><div id="files"></div></main>

  <div class="composer on" id="composer">
    <div class="inputwrap">
      <input id="task" placeholder="说一句话，员工自己会分工…" autocomplete="off">
    </div>
    <button class="send" id="send" title="派活">
      <svg viewBox="0 0 24 24" fill="none" stroke="#04140F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>

  <nav class="tabbar">
    <button class="tab on" data-v="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6c0 4.1-3.8 7.4-8.5 7.4-1 0-2-.15-2.9-.42L4.5 20l1.2-3.6A7 7 0 0 1 3.5 11.6c0-4.1 3.8-7.4 8.5-7.4s8.5 3.3 8.5 7.4z"/></svg>
      对话
    </button>
    <button class="tab" data-v="staff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.2" r="3.3"/><path d="M3.2 19.8c0-3.2 2.6-5.3 5.8-5.3s5.8 2.1 5.8 5.3"/><path d="M16.4 5.6a3 3 0 0 1 .1 5.6M18.2 19.8c0-2.2-.6-3.8-1.7-4.9"/></svg>
      团队
    </button>
    <button class="tab" data-v="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.2A1.7 1.7 0 0 1 5.7 6.5h3.6L11 9h7.3A1.7 1.7 0 0 1 20 10.7v7.6a1.7 1.7 0 0 1-1.7 1.7H5.7A1.7 1.7 0 0 1 4 18.3z"/></svg>
      文件
    </button>
  </nav>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h2>招人</h2>
    <p class="sub">挑一个 AI，给它一个岗位。招进来它就在你公司上班了。</p>
    <div class="lbl">选谁</div>
    <div id="engineOpts"></div>
    <div class="lbl">干什么</div>
    <div id="roleOpts"></div>
    <div class="rowbtn">
      <button id="cancel">取消</button>
      <button class="pri" id="confirm" disabled>入职</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let S = { staff: [], messages: [], deliveries: [], engines: [], roles: [], busy: false, dshReady: false };
let view = "chat";
let pick = { engine: null, role: null };
const seen = new Set();
const ROLE_CLASS = { secretary: "r-secretary", writer: "r-writer", reviewer: "r-reviewer", researcher: "r-researcher" };

function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function hhmm(t){ const d = new Date(t); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function who(id){
  if (id === "boss") return { engine: "你", roleName: "老板", role: "" };
  return S.staff.find(x => x.id === id) || { engine: "某人", roleName: "", role: "" };
}
const initials = (s) => (s.roleName || s.engine || "?").slice(0,1);

// 离职的人还留在名单里（不然历史消息里就只剩「某人」），但界面上不该再出现
const activeStaff = () => S.staff.filter(x => !x.gone);

// 同一条旧发言，现在看起来会像「他还在这个岗位上」。
// 团队页早就不显示离职的人了，聊天记录里必须自己标出来，否则两边对不上。
const goneTag = (s) => (s && s.gone) ? `<span class="chip off">已离职</span>` : "";
const nameOf = (s) => `${s.engine}（${s.roleName}${s.gone ? " · 已离职" : ""}）`;

// 后端给的是引擎 id（deepseek-flash），界面上要显示名字（DeepSeek Flash）
function applyState(s){
  S = s;
  S.staff = (S.staff || []).map(x => ({ ...x, engineId: x.engine, engine: x.engineName || x.engine }));
  return S;
}

/* ---------- 顶栏状态 ---------- */
function head(){
  const n = activeStaff().length;
  const d = $("#dot"), t = $("#sub");
  if (!S.dshReady){ d.className = "pulse off"; t.textContent = "没接上 DSH"; }
  else if (S.busy){ d.className = "pulse"; t.textContent = n ? n + " 人在职 · 正在干活" : "正在干活"; }
  else { d.className = "pulse"; t.textContent = n ? n + " 人在职 · 待命" : "还没有员工"; }
  $("#send").disabled = S.busy || !n;
  syncComposer();
}

// 公司里没人时，不给输入框 —— 给了也用不了，不如直接给个招人的入口
function syncComposer(){
  const show = view === "chat" && activeStaff().length > 0;
  $("#composer").classList.toggle("on", show);
}

/* ---------- 对话 ---------- */
function renderStream(){
  const box = $("#stream");
  if (!S.messages.length){
    box.innerHTML = `<div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6c0 4.1-3.8 7.4-8.5 7.4-1 0-2-.15-2.9-.42L4.5 20l1.2-3.6A7 7 0 0 1 3.5 11.6c0-4.1 3.8-7.4 8.5-7.4s8.5 3.3 8.5 7.4z"/></svg></div>
      <b>${activeStaff().length ? "说一句话就开工" : "公司还空着"}</b>
      <p>${activeStaff().length
        ? "在下面说清你要什么。<br>员工会自己分工、自己交接，只在需要你拍板时打断你。"
        : "把你电脑上已有的 AI 招进来，给它们岗位。<br>之后在这里说一句话，他们自己会分工。"}</p>
      ${activeStaff().length ? "" : `<div class="rowbtn" style="max-width:220px;margin:22px auto 0"><button class="pri" id="hireEmpty">招人</button></div>`}
    </div>`;
    const hb = $("#hireEmpty");
    if (hb) hb.onclick = openSheet;
    return;
  }
  const frag = document.createDocumentFragment();
  S.messages.forEach(m => frag.appendChild(bubble(m)));
  box.replaceChildren(...frag.childNodes);
  const main = $("#m-chat");
  main.scrollTop = main.scrollHeight;
}

function bubble(m){
  const el = document.createElement("div");

  if (m.kind === "system" || m.kind === "status" || m.kind === "tool"){
    if (m.kind === "system"){ el.className = "sys"; el.textContent = m.text; return el; }
    if (m.kind === "tool"){
      el.className = "tool";
      const s = who(m.from);
      el.textContent = `${s.engine} 正在用 ${m.text}`;
      return el;
    }
    el.className = "status";
    const s = who(m.from);
    el.innerHTML = `<span class="sp"></span><span>${esc(s.engine)}（${esc(s.roleName)}）${esc(m.text)}</span>`;
    return el;
  }

  if (m.kind === "dm"){
    const a = who(m.from), b = who(m.to);
    el.className = "dm";
    el.innerHTML = `<div class="h">私聊 · <b>${esc(a.engine)}（${esc(a.roleName)}）</b> → <b>${esc(b.engine)}（${esc(b.roleName)}）</b></div><div>${esc(m.text)}</div>`;
    return el;
  }

  if (m.kind === "secret"){
    const a = who(m.from);
    const relayed = S.staff.find(s => s.id === m.relayedTo);
    const lock = `<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>`;
    el.className = "sec";
    el.innerHTML = `<div class="h">${lock}只给你 · ${esc(a.engine)}（${esc(a.roleName)}）的密报</div>
      <div class="b">${esc(m.text)}</div>`
      + (relayed
        ? `<div class="acts"><span class="relayed">已交给 ${esc(relayed.engine)}（${esc(relayed.roleName)}）</span></div>`
        : `<div class="acts">${activeStaff().filter(s => s.id !== m.from).map(s =>
            `<button class="mini" data-relay="${m.id}" data-to="${s.id}">转给${esc(s.roleName)}</button>`).join("")}
            <span class="mute">不转，就只有你知道</span></div>`);
    return el;
  }

  const me = m.from === "boss";
  const s = who(m.from);
  el.className = "row" + (me ? " me" : "");
  el.innerHTML = `<div class="av ${me ? "me-av" : (ROLE_CLASS[s.role] || "")}">${esc(me ? "我" : initials(s))}</div>
    <div class="msg">
      <div class="who"><b>${esc(me ? "你" : s.engine)}</b><span class="chip">${esc(me ? "老板" : s.roleName)}</span></div>
      <div class="bub">${esc(m.text)}</div>
    </div>`;
  return el;
}

/* ---------- 团队 ---------- */
function renderRoster(){
  const box = $("#roster");
  const crew = activeStaff();
  if (!crew.length){
    box.innerHTML = `<div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.2" r="3.3"/><path d="M3.2 19.8c0-3.2 2.6-5.3 5.8-5.3s5.8 2.1 5.8 5.3"/><path d="M16.4 5.6a3 3 0 0 1 .1 5.6M18.2 19.8c0-2.2-.6-3.8-1.7-4.9"/></svg></div>
      <b>还没有员工</b>
      <p>把你电脑上已有的 AI 招进来，给它一个岗位。<br>同一个引擎，换个岗位就是另一个人。</p>
    </div>
    <div class="rowbtn"><button class="pri" id="hireBtn">招第一个人</button></div>`;
    $("#hireBtn").onclick = openSheet;
    return;
  }
  box.innerHTML = crew.map(s => `
    <div class="staff">
      <div class="top">
        <div class="av ${ROLE_CLASS[s.role] || ""}">${esc(initials(s))}</div>
        <div>
          <div class="nm">${esc(s.roleName)}</div>
          <div class="pos">${esc(s.engine)}</div>
        </div>
        <button class="del" data-fire="${s.id}" title="让人离职">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="foot">
        <span class="meta ${s.sessionId ? "on" : ""}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          ${s.sessionId ? "有记忆" : "还没上过班"}
        </span>
        <span class="meta">${esc(s.engine)}</span>
      </div>
    </div>`).join("")
    + `<div class="rowbtn"><button class="pri" id="hireBtn">再招一个</button></div>`;
  $("#hireBtn").onclick = openSheet;
}

/* ---------- 文件 ---------- */
function renderFiles(){
  const box = $("#files");
  if (!S.deliveries.length){
    box.innerHTML = `<div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.2A1.7 1.7 0 0 1 5.7 6.5h3.6L11 9h7.3A1.7 1.7 0 0 1 20 10.7v7.6a1.7 1.7 0 0 1-1.7 1.7H5.7A1.7 1.7 0 0 1 4 18.3z"/></svg></div>
      <b>还没有产出</b>
      <p>活干完会存在这里，同时落成真的 markdown 文件，<br>在 workspace/deliverables/ 里能直接打开。</p>
    </div>`;
    return;
  }
  box.innerHTML = S.deliveries.map(d => {
    const by = d.by ? who(d.by) : { engine: "员工", roleName: "" };
    const label = d.verdict === "pass" ? "已通过" : d.verdict === "pending" ? "待你验收" : "被打回";
    return `<div class="file">
      <div class="hd">
        <div class="fi"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5H7.5A1.5 1.5 0 0 0 6 5v14a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 18 19V7.5z"/><path d="M14 3.5V7.5H18"/></svg></div>
        <div style="min-width:0">
          <div class="ti">${esc(d.title)}</div>
          <div class="sub">${esc(by.engine)}${by.roleName ? "（" + esc(by.roleName) + "）" : ""} · ${hhmm(d.at)}</div>
        </div>
        <span class="tag ${d.verdict}">${label}</span>
      </div>
      ${d.reason ? `<div class="why">${esc(d.reason)}</div>` : ""}
      <div class="pre">${esc(d.body)}</div>
      ${d.file ? `<div class="path" title="${esc(d.file)}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 19.5"/></svg>
        ${esc(d.file.split("/").pop())}</div>` : ""}
    </div>`;
  }).join("");
}

function renderAll(){
  head();
  if (view === "chat") renderStream();
  if (view === "staff") renderRoster();
  if (view === "file") renderFiles();
}

/* ---------- 招人面板 ---------- */
function openSheet(){
  pick = { engine: null, role: null };
  const ready = S.engines.filter(e => e.ready);
  const notReady = S.engines.filter(e => !e.ready);

  // 能用的正常列出来；没接上的收成一句话，别占满屏幕
  $("#engineOpts").innerHTML = ready.map(e => `
    <div class="opt" data-eng="${e.id}">
      <div><div class="n">${esc(e.name)}</div><div class="d">${esc(e.note)}</div></div>
      <div class="chk"></div>
    </div>`).join("")
    + (notReady.length
      ? `<div class="hint">还有 ${notReady.length} 个没接上：${notReady.map(e => esc(e.name)).join("、")}。<br>
         去 DSH「设置 → 模型 → 添加模型提供商」填好密钥，它们就会出现在这里。</div>`
      : "");

  $("#roleOpts").innerHTML = S.roles.map(r => {
    const taken = activeStaff().some(s => s.role === r.id);
    return `<div class="opt ${taken ? "dis" : ""}" data-role="${r.id}">
      <div><div class="n">${esc(r.name)}${taken ? " · 已有" : ""}</div><div class="d">${esc(r.duty)}</div></div>
      <div class="chk"></div>
    </div>`;
  }).join("");

  $("#engineOpts").onclick = (ev) => {
    const o = ev.target.closest("[data-eng]"); if (!o) return;
    [...$("#engineOpts").children].forEach(x => x.classList.remove("sel"));
    o.classList.add("sel"); pick.engine = o.dataset.eng; syncConfirm();
  };
  $("#roleOpts").onclick = (ev) => {
    const o = ev.target.closest("[data-role]"); if (!o) return;
    if (o.classList.contains("dis")) return;
    [...$("#roleOpts").children].forEach(x => x.classList.remove("sel"));
    o.classList.add("sel"); pick.role = o.dataset.role; syncConfirm();
  };

  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
  syncConfirm();
}
const syncConfirm = () => { $("#confirm").disabled = !(pick.engine && pick.role); };
function closeSheet(){ $("#mask").classList.remove("on"); $("#sheet").classList.remove("on"); }

/* ---------- 动作 ---------- */
async function post(path, data){
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}) });
  return r.json();
}
async function doHire(){
  const r = await post("/api/hire", pick);
  if (r.error) return alert(r.error);
  S.staff = (r.staff || []).map(x => ({ ...x, engineId: x.engine, engine: x.engineName || x.engine }));
  closeSheet(); renderAll();
}
async function doFire(id){
  if (!confirm("确定让人离职？它会忘记这期间的所有事。")) return;
  const r = await post("/api/fire", { id });
  if (r.error) return alert(r.error);
  S.staff = (r.staff || []).map(x => ({ ...x, engineId: x.engine, engine: x.engineName || x.engine }));
  renderAll();
}
async function doTask(){
  const el = $("#task");
  const t = el.value.trim();
  if (!t) return;
  el.value = "";
  const r = await post("/api/task", { text: t });
  if (r.error) alert(r.error);
}
async function doRelay(msgId, to){
  const r = await post("/api/relay", { msgId, to });
  if (r.error) return alert(r.error);
  const m = S.messages.find(x => x.id === msgId);
  if (m) m.relayedTo = to;
  renderStream();
}

/* ---------- 事件 ---------- */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    view = t.dataset.v;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
    document.querySelectorAll(".pane").forEach(p => p.classList.remove("on"));
    $("#m-" + view).classList.add("on");
    renderAll();
  };
});

document.addEventListener("click", (ev) => {
  const f = ev.target.closest("[data-fire]");
  if (f) return doFire(f.dataset.fire);
  const rl = ev.target.closest("[data-relay]");
  if (rl) return doRelay(Number(rl.dataset.relay), rl.dataset.to);
});

$("#send").onclick = doTask;
$("#task").addEventListener("keydown", (e) => { if (e.key === "Enter") doTask(); });
$("#confirm").onclick = doHire;
$("#cancel").onclick = closeSheet;
$("#mask").onclick = closeSheet;
$("#hireTop").onclick = openSheet;

/* ---------- 启动 ---------- */
async function boot(){
  try {
    const r = await fetch("/api/state");
    applyState(await r.json());
    S.messages.forEach(m => seen.add(m.id));
  } catch {}
  renderAll();

  const es = new EventSource("/api/events");
  es.onopen = async () => {
    $("#dot").className = "pulse";
    try {
      const r = await fetch("/api/state");
      const s = applyState(await r.json());
      S.staff = s.staff; S.messages = s.messages; S.deliveries = s.deliveries; S.busy = s.busy;
      S.messages.forEach(m => seen.add(m.id));
      renderAll();
    } catch {}
  };
  es.onmessage = async (e) => {
    const d = JSON.parse(e.data);
    if (d.type === "message"){
      if (seen.has(d.msg.id)) return;
      seen.add(d.msg.id);
      S.messages.push(d.msg);
      if (S.messages.length > 300) S.messages = S.messages.slice(-250);
      if (view === "chat"){
        const box = $("#stream");
        if (box.querySelector(".empty")) renderStream();
        else {
          box.appendChild(bubble(d.msg));
          const main = $("#m-chat");
          main.scrollTop = main.scrollHeight;
        }
        head();
      }
    } else if (d.type === "busy"){
      S.busy = d.busy; head();
    } else if (d.type === "deliveries"){
      try {
        const r2 = await fetch("/api/state");
        const s2 = await r2.json();
        S.deliveries = s2.deliveries;
        if (view === "file") renderFiles();
      } catch {}
    }
  };
  es.onerror = () => { $("#dot").className = "pulse off"; $("#sub").textContent = "断线了"; };
}

boot();
</script>
</body>
